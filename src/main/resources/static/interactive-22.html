<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D Boids Flocking Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0d1117; user-select: none; }
        #ui-layer {
            position: absolute; top: 15px; left: 15px; width: 320px;
            background: rgba(13, 17, 23, 0.85); color: #c9d1d9;
            padding: 20px; border-radius: 8px; font-family: sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8); z-index: 100;
            border: 1px solid #30363d; backdrop-filter: blur(5px);
        }
        h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #30363d; padding-bottom: 10px; color: #58a6ff; }
        .instruction { font-size: 12px; line-height: 1.5; margin-bottom: 15px; color: #8b949e; }
        .control-group { margin-bottom: 15px; }
        label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; color: #c9d1d9; font-weight: bold; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #58a6ff; }

        @media (max-width: 560px) {
            #ui-layer { display: none; }
        }
    </style>
</head>
<body>
<div id="ui-layer">
    <h2>군집 행동 (Boids) 시뮬레이터</h2>
    <div class="instruction">
        자연계의 새떼나 물고기 떼의 유기적인 움직임을 수학적으로 모방한 인공 생명 알고리즘입니다.<br><br>
        <strong>마우스 이동:</strong> 포식자 접근 (무리 흩어짐)
    </div>

    <div class="control-group">
        <label><span>분리 (Separation)</span> <span id="val-sep">1.5</span></label>
        <input type="range" id="inp-sep" min="0.0" max="5.0" step="0.1" value="1.5">
    </div>
    <div class="control-group">
        <label><span>정렬 (Alignment)</span> <span id="val-ali">1.0</span></label>
        <input type="range" id="inp-ali" min="0.0" max="5.0" step="0.1" value="1.0">
    </div>
    <div class="control-group">
        <label><span>응집 (Cohesion)</span> <span id="val-coh">1.0</span></label>
        <input type="range" id="inp-coh" min="0.0" max="5.0" step="0.1" value="1.0">
    </div>
    <div class="control-group">
        <label><span>최대 속도 (Max Speed)</span> <span id="val-speed">0.4</span></label>
        <input type="range" id="inp-speed" min="0.1" max="1.0" step="0.05" value="0.4">
    </div>
</div>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
      }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d1117, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 80);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x58a6ff, 1.5);
    dirLight.position.set(20, 50, 20);
    scene.add(dirLight);

    const backLight = new THREE.DirectionalLight(0xff7b72, 0.8);
    backLight.position.set(-20, -20, -20);
    scene.add(backLight);

    // Boid Data Structure
    const BOID_COUNT = 1000;
    const BOUNDARY = 40;
    const boids = [];

    for (let i = 0; i < BOID_COUNT; i++) {
        boids.push({
            position: new THREE.Vector3(
                (Math.random() - 0.5) * BOUNDARY,
                (Math.random() - 0.5) * BOUNDARY,
                (Math.random() - 0.5) * BOUNDARY
            ),
            velocity: new THREE.Vector3(
                (Math.random() - 0.5),
                (Math.random() - 0.5),
                (Math.random() - 0.5)
            ).normalize().multiplyScalar(Math.random() * 0.2 + 0.1),
            acceleration: new THREE.Vector3()
        });
    }

    // InstancedMesh Setup
    const geometry = new THREE.ConeGeometry(0.5, 2.0, 4);
    geometry.rotateX(Math.PI / 2);
    const material = new THREE.MeshPhongMaterial({
        color: 0x58a6ff,
        flatShading: true
    });

    const instancedMesh = new THREE.InstancedMesh(geometry, material, BOID_COUNT);
    scene.add(instancedMesh);

    const dummy = new THREE.Object3D();

    // Mouse Predator Setup
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const intersectPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    let predatorPos = new THREE.Vector3(999, 999, 999);

    document.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        raycaster.ray.intersectPlane(intersectPlane, predatorPos);
    });

    // UI Binding
    const params = {
        separation: 1.5,
        alignment: 1.0,
        cohesion: 1.0,
        maxSpeed: 0.4,
        maxForce: 0.02,
        perceptionRadius: 5.0
    };

    const bindSlider = (id, key) => {
        const el = document.getElementById(id);
        const display = document.getElementById(id.replace('inp-', 'val-'));
        el.addEventListener('input', () => {
            display.textContent = el.value;
            params[key] = parseFloat(el.value);
        });
    };

    bindSlider('inp-sep', 'separation');
    bindSlider('inp-ali', 'alignment');
    bindSlider('inp-coh', 'cohesion');
    bindSlider('inp-speed', 'maxSpeed');

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Boids Algorithm Execution
    function updateBoids() {
        for (let i = 0; i < BOID_COUNT; i++) {
            const boid = boids[i];
            let sep = new THREE.Vector3();
            let ali = new THREE.Vector3();
            let coh = new THREE.Vector3();
            let total = 0;

            for (let j = 0; j < BOID_COUNT; j++) {
                if (i === j) continue;
                const other = boids[j];
                const dist = boid.position.distanceTo(other.position);

                if (dist > 0 && dist < params.perceptionRadius) {
                    // Separation logic
                    const diff = new THREE.Vector3().subVectors(boid.position, other.position);
                    diff.normalize().divideScalar(dist);
                    sep.add(diff);

                    // Alignment logic
                    ali.add(other.velocity);

                    // Cohesion logic
                    coh.add(other.position);

                    total++;
                }
            }

            if (total > 0) {
                sep.divideScalar(total);
                if (sep.length() > 0) {
                    sep.normalize().multiplyScalar(params.maxSpeed).sub(boid.velocity).clampLength(0, params.maxForce);
                }

                ali.divideScalar(total);
                ali.normalize().multiplyScalar(params.maxSpeed).sub(boid.velocity).clampLength(0, params.maxForce);

                coh.divideScalar(total);
                coh.sub(boid.position).normalize().multiplyScalar(params.maxSpeed).sub(boid.velocity).clampLength(0, params.maxForce);
            }

            boid.acceleration.add(sep.multiplyScalar(params.separation));
            boid.acceleration.add(ali.multiplyScalar(params.alignment));
            boid.acceleration.add(coh.multiplyScalar(params.cohesion));

            // Predator avoidance logic
            const distToPredator = boid.position.distanceTo(predatorPos);
            if (distToPredator < 15.0) {
                const fleeForce = new THREE.Vector3().subVectors(boid.position, predatorPos);
                fleeForce.normalize().multiplyScalar(params.maxSpeed).sub(boid.velocity).clampLength(0, params.maxForce * 5);
                boid.acceleration.add(fleeForce.multiplyScalar(3.0));
            }

            // Boundary containment logic
            const boundaryForce = new THREE.Vector3();
            if (Math.abs(boid.position.x) > BOUNDARY) boundaryForce.x = -Math.sign(boid.position.x);
            if (Math.abs(boid.position.y) > BOUNDARY) boundaryForce.y = -Math.sign(boid.position.y);
            if (Math.abs(boid.position.z) > BOUNDARY) boundaryForce.z = -Math.sign(boid.position.z);
            boid.acceleration.add(boundaryForce.multiplyScalar(0.05));
        }

        for (let i = 0; i < BOID_COUNT; i++) {
            const boid = boids[i];

            boid.velocity.add(boid.acceleration);
            boid.velocity.clampLength(0, params.maxSpeed);
            boid.position.add(boid.velocity);
            boid.acceleration.set(0, 0, 0);

            dummy.position.copy(boid.position);

            // Align geometry to velocity direction
            const target = boid.position.clone().add(boid.velocity);
            dummy.lookAt(target);

            dummy.updateMatrix();
            instancedMesh.setMatrixAt(i, dummy.matrix);
        }
        instancedMesh.instanceMatrix.needsUpdate = true;
    }

    function animate() {
        requestAnimationFrame(animate);
        updateBoids();
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
