<html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>네트워크 토폴로지 시각화</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0f1e;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
<canvas id="networkCanvas"></canvas>
<script>
    const canvas = document.getElementById('networkCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const nodes = [];
    const numNodes = 100;
    class Node {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 1.2;
            this.vy = (Math.random() - 0.5) * 1.2;
            this.radius = 1.5;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            // Bounce off walls
            if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#00ffcc';
            ctx.fill();
        }
    }
    // Initialize nodes
    for (let i = 0; i < numNodes; i++) {
        nodes.push(new Node());
    }

    function animate() {
        // Clear canvas entirely for sharp rendering
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < nodes.length; i++) {
            nodes[i].update();
            nodes[i].draw();
            // Connect nodes within specific distance
            for (let j = i + 1; j < nodes.length; j++) {
                const dx = nodes[i].x - nodes[j].x;
                const dy = nodes[i].y - nodes[j].y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 120) {
                    ctx.beginPath();
                    ctx.moveTo(nodes[i].x, nodes[i].y);
                    ctx.lineTo(nodes[j].x, nodes[j].y);
                    ctx.strokeStyle = `rgba(0, 255, 204, ${1 - distance / 120})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animate);
    }
    animate();
    // Connect to Spring Boot SSE
    const eventSource = new EventSource('/api/network/stream');
    eventSource.addEventListener('trafficUpdate', function(event) {
        const data = JSON.parse(event.data);
        // Adjust visualization logic based on data.trafficDensity here
    });
</script>
</body>

</html>
