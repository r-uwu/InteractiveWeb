<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Symphony</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Raleway:wght@100;200;300;400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --aurora-1: #00ffe7;
            --aurora-2: #a855f7;
            --aurora-3: #f0abfc;
            --aurora-4: #22d3ee;
            --dark: #020408;
            --panel-bg: rgba(2, 8, 20, 0.82);
            --border: rgba(0, 255, 231, 0.18);
            --text-glow: 0 0 18px rgba(0,255,231,0.7);
        }

        html, body {
            width: 100%; height: 100%;
            background: var(--dark);
            overflow: hidden;
            cursor: none;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        /* Custom Cursor */
        .cursor-ring {
            position: fixed;
            top: 0; left: 0;
            width: 36px; height: 36px;
            border: 1.5px solid rgba(0,255,231,0.85);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.15s, height 0.15s, border-color 0.15s;
            mix-blend-mode: screen;
        }
        .cursor-dot {
            position: fixed;
            top: 0; left: 0;
            width: 6px; height: 6px;
            background: #00ffe7;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px 4px rgba(0,255,231,0.6);
        }

        /* Header */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            padding: 28px 40px 0;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            pointer-events: none;
        }

        .title-block {
            display: flex;
            flex-direction: column;
        }

        .title-main {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(1.4rem, 3.5vw, 2.6rem);
            color: #fff;
            letter-spacing: 0.18em;
            text-shadow: var(--text-glow), 0 0 60px rgba(168,85,247,0.5);
            line-height: 1;
        }

        .title-sub {
            font-family: 'Raleway', sans-serif;
            font-weight: 200;
            font-size: clamp(0.6rem, 1.2vw, 0.78rem);
            color: rgba(0,255,231,0.6);
            letter-spacing: 0.55em;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .status-line {
            font-family: 'Raleway', sans-serif;
            font-weight: 300;
            font-size: 0.68rem;
            color: rgba(255,255,255,0.28);
            letter-spacing: 0.22em;
            text-transform: uppercase;
            text-align: right;
            line-height: 1.8;
        }

        .status-dot {
            display: inline-block;
            width: 5px; height: 5px;
            background: #00ffe7;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,255,231,0.4); }
            50% { opacity: 0.5; box-shadow: 0 0 0 5px rgba(0,255,231,0); }
        }

        /* Control Panel */
        .control-panel {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 200px;
        }

        .panel-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 0 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .panel-label {
            font-family: 'Raleway', sans-serif;
            font-weight: 300;
            font-size: 0.6rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(0,255,231,0.55);
            margin-bottom: 10px;
        }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .slider-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .slider-name {
            font-family: 'Raleway', sans-serif;
            font-weight: 400;
            font-size: 0.68rem;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.1em;
            display: flex;
            justify-content: space-between;
        }

        .slider-val {
            color: rgba(0,255,231,0.8);
            font-size: 0.65rem;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--aurora-1);
            box-shadow: 0 0 10px rgba(0,255,231,0.9);
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type=range]:hover::-webkit-slider-thumb {
            transform: scale(1.4);
        }

        /* Color Swatches */
        .swatch-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .swatch {
            width: 22px; height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s, border-color 0.15s;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        .swatch:hover { transform: scale(1.25); }
        .swatch.active { border-color: #fff; transform: scale(1.2); }

        /* Toggle Buttons */
        .toggle-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toggle-btn {
            font-family: 'Raleway', sans-serif;
            font-size: 0.6rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0,255,231,0.25);
            background: transparent;
            color: rgba(255,255,255,0.45);
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn:hover, .toggle-btn.active {
            background: rgba(0,255,231,0.12);
            border-color: rgba(0,255,231,0.6);
            color: rgba(0,255,231,0.9);
            box-shadow: 0 0 12px rgba(0,255,231,0.25);
        }

        /* Bottom hint */
        .bottom-hint {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            font-family: 'Raleway', sans-serif;
            font-weight: 200;
            font-size: 0.65rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.2);
            white-space: nowrap;
            pointer-events: none;
            animation: fade-hint 4s ease-in-out 2s both;
        }

        @keyframes fade-hint {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0.15; }
        }

        /* Scanline overlay */
        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                    to bottom,
                    transparent 0px,
                    transparent 3px,
                    rgba(0,0,0,0.04) 3px,
                    rgba(0,0,0,0.04) 4px
            );
            pointer-events: none;
            z-index: 50;
            opacity: 0.6;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.75) 100%);
            pointer-events: none;
            z-index: 51;
        }

        /* RESPONSIVE: hide controls < 560px */
        @media (max-width: 559px) {
            .control-panel { display: none; }
            .header { padding: 20px 20px 0; }
            .title-main { font-size: 1.3rem; }
            .title-sub { font-size: 0.55rem; }
            .status-line { display: none; }
        }
    </style>
</head>
<body>

<canvas id="c"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<div class="cursor-ring" id="ring"></div>
<div class="cursor-dot" id="dot"></div>

<div class="header">
    <div class="title-block">
        <div class="title-main">AURORA</div>
        <div class="title-sub">Particle Symphony</div>
    </div>
    <div class="status-line">
        <span class="status-dot"></span>Live Render<br>
        <span id="fps-display">-- fps</span><br>
        <span id="particle-count-display">-- particles</span>
    </div>
</div>

<!-- Control Panel (hidden < 560px) -->
<div class="control-panel">
    <div class="panel-card">
        <div class="panel-label">Parameters</div>
        <div class="slider-row">
            <div class="slider-item">
                <div class="slider-name">
                    <span>Particles</span>
                    <span class="slider-val" id="count-val">320</span>
                </div>
                <input type="range" id="count-slider" min="60" max="800" value="320" step="10">
            </div>
            <div class="slider-item">
                <div class="slider-name">
                    <span>Speed</span>
                    <span class="slider-val" id="speed-val">1.0</span>
                </div>
                <input type="range" id="speed-slider" min="1" max="30" value="10" step="1">
            </div>
            <div class="slider-item">
                <div class="slider-name">
                    <span>Attraction</span>
                    <span class="slider-val" id="attract-val">0.5</span>
                </div>
                <input type="range" id="attract-slider" min="0" max="20" value="5" step="1">
            </div>
            <div class="slider-item">
                <div class="slider-name">
                    <span>Connection Dist</span>
                    <span class="slider-val" id="dist-val">120</span>
                </div>
                <input type="range" id="dist-slider" min="40" max="250" value="120" step="5">
            </div>
            <div class="slider-item">
                <div class="slider-name">
                    <span>Tail Length</span>
                    <span class="slider-val" id="tail-val">0.88</span>
                </div>
                <input type="range" id="tail-slider" min="50" max="98" value="88" step="1">
            </div>
        </div>
    </div>

    <div class="panel-card">
        <div class="panel-label">Color Palette</div>
        <div class="swatch-row" id="swatches">
            <div class="swatch active" data-palette="aurora" style="background: linear-gradient(135deg,#00ffe7,#a855f7)"></div>
            <div class="swatch" data-palette="fire" style="background: linear-gradient(135deg,#ff6b35,#f7c59f)"></div>
            <div class="swatch" data-palette="ocean" style="background: linear-gradient(135deg,#0077b6,#90e0ef)"></div>
            <div class="swatch" data-palette="rose" style="background: linear-gradient(135deg,#ff006e,#ffbe0b)"></div>
            <div class="swatch" data-palette="matrix" style="background: linear-gradient(135deg,#00ff41,#003b00)"></div>
            <div class="swatch" data-palette="ice" style="background: linear-gradient(135deg,#caf0f8,#ade8f4)"></div>
        </div>
    </div>

    <div class="panel-card">
        <div class="panel-label">Effects</div>
        <div class="toggle-row">
            <button class="toggle-btn active" id="btn-lines">Lines</button>
            <button class="toggle-btn active" id="btn-glow">Glow</button>
            <button class="toggle-btn" id="btn-repel">Repel</button>
            <button class="toggle-btn active" id="btn-drift">Drift</button>
        </div>
    </div>
</div>

<div class="bottom-hint">move your cursor to sculpt the aurora</div>

<script>
    (function() {
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const ring = document.getElementById('ring');
        const dot = document.getElementById('dot');

        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Palettes
        const PALETTES = {
            aurora:  ['#00ffe7','#00e5ff','#a855f7','#f0abfc','#22d3ee','#818cf8'],
            fire:    ['#ff6b35','#f7c59f','#ef8354','#ff9f1c','#ffbf69','#ff4d6d'],
            ocean:   ['#0077b6','#00b4d8','#90e0ef','#caf0f8','#48cae4','#ade8f4'],
            rose:    ['#ff006e','#fb5607','#ffbe0b','#ff4d6d','#f72585','#b5179e'],
            matrix:  ['#00ff41','#00d400','#00a300','#39ff14','#7fff00','#adff2f'],
            ice:     ['#caf0f8','#ade8f4','#90e0ef','#e0fbfc','#d8f3dc','#b7e4c7'],
        };

        // State
        let state = {
            count: 320,
            speed: 1.0,
            attraction: 0.5,
            distThreshold: 120,
            tail: 0.88,
            palette: 'aurora',
            showLines: true,
            glow: true,
            repel: false,
            drift: true,
        };

        let mouse = { x: W / 2, y: H / 2, active: false };
        let particles = [];
        let lastTime = 0;
        let frameCount = 0;
        let lastFps = performance.now();

        // Particle
        function createParticle() {
            const colors = PALETTES[state.palette];
            return {
                x: Math.random() * W,
                y: Math.random() * H,
                vx: (Math.random() - 0.5) * 1.2,
                vy: (Math.random() - 0.5) * 1.2,
                r: Math.random() * 2.2 + 0.6,
                color: colors[Math.floor(Math.random() * colors.length)],
                angle: Math.random() * Math.PI * 2,
                angleSpeed: (Math.random() - 0.5) * 0.018,
                life: Math.random(),
                lifeDir: (Math.random() > 0.5 ? 1 : -1) * 0.003,
            };
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < state.count; i++) particles.push(createParticle());
        }

        function recolorParticles() {
            const colors = PALETTES[state.palette];
            particles.forEach(p => { p.color = colors[Math.floor(Math.random() * colors.length)]; });
        }

        initParticles();

        // Hex to RGB
        function hexRgb(hex) {
            const r = parseInt(hex.slice(1,3),16);
            const g = parseInt(hex.slice(3,5),16);
            const b = parseInt(hex.slice(5,7),16);
            return [r,g,b];
        }

        // Aurora background flow
        let bgTime = 0;
        function drawBackground() {
            bgTime += 0.003;
            ctx.fillStyle = `rgba(2,4,8,${state.tail})`;
            ctx.fillRect(0, 0, W, H);

            // Soft aurora glow bands
            for (let i = 0; i < 3; i++) {
                const x = W * (0.2 + i * 0.3 + Math.sin(bgTime + i * 1.5) * 0.15);
                const y = H * (0.3 + Math.sin(bgTime * 0.7 + i) * 0.2);
                const colors = PALETTES[state.palette];
                const c = colors[i % colors.length];
                const [r,g,b] = hexRgb(c);
                const grad = ctx.createRadialGradient(x, y, 0, x, y, W * 0.38);
                grad.addColorStop(0, `rgba(${r},${g},${b},0.055)`);
                grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
            }
        }

        // Noise-ish
        function noise(x, y, t) {
            return Math.sin(x * 0.008 + t) * Math.cos(y * 0.006 + t * 0.7) +
                Math.sin(x * 0.015 - t * 0.5) * 0.5;
        }

        function drawParticles() {
            const colors = PALETTES[state.palette];

            // Lines
            if (state.showLines) {
                const dist2 = state.distThreshold * state.distThreshold;
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const d2 = dx*dx + dy*dy;
                        if (d2 < dist2) {
                            const alpha = (1 - d2 / dist2) * 0.28;
                            const [r,g,b] = hexRgb(particles[i].color);
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
                            ctx.lineWidth = 0.6;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
            }

            // Particles
            particles.forEach(p => {
                const [r,g,b] = hexRgb(p.color);
                const alpha = 0.55 + p.life * 0.45;

                if (state.glow) {
                    const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
                    grd.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
                    grd.addColorStop(0.4, `rgba(${r},${g},${b},${alpha * 0.3})`);
                    grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r * 5, 0, Math.PI * 2);
                    ctx.fillStyle = grd;
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
                ctx.fill();
            });
        }

        function updateParticles(dt) {
            const t = performance.now() * 0.001;
            const sp = state.speed;

            particles.forEach(p => {
                // Drift via noise flow field
                if (state.drift) {
                    const n = noise(p.x, p.y, t * 0.4);
                    p.vx += Math.cos(n * Math.PI * 2) * 0.012 * sp;
                    p.vy += Math.sin(n * Math.PI * 2) * 0.012 * sp;
                }

                // Mouse interaction
                if (mouse.active || true) {
                    const dx = mouse.x - p.x;
                    const dy = mouse.y - p.y;
                    const d = Math.sqrt(dx*dx + dy*dy) || 1;
                    const force = (state.attraction * 0.4) / (d * 0.5);
                    const dir = state.repel ? -1 : 1;
                    if (d < 260) {
                        p.vx += dir * dx / d * force * sp;
                        p.vy += dir * dy / d * force * sp;
                    }
                }

                // Damping
                p.vx *= 0.965;
                p.vy *= 0.965;

                // Clamp speed
                const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
                const maxS = 3.5 * sp;
                if (speed > maxS) { p.vx = p.vx/speed*maxS; p.vy = p.vy/speed*maxS; }

                p.x += p.vx * sp;
                p.y += p.vy * sp;

                // Life pulse
                p.life += p.lifeDir;
                if (p.life > 1 || p.life < 0) p.lifeDir *= -1;

                // Wrap edges
                if (p.x < -20) p.x = W + 20;
                if (p.x > W + 20) p.x = -20;
                if (p.y < -20) p.y = H + 20;
                if (p.y > H + 20) p.y = -20;
            });
        }

        // FPS counter
        let fpsArr = [];
        function updateFps(now) {
            frameCount++;
            if (now - lastFps > 500) {
                const fps = Math.round(frameCount / ((now - lastFps) / 1000));
                document.getElementById('fps-display').textContent = fps + ' fps';
                document.getElementById('particle-count-display').textContent = particles.length + ' particles';
                frameCount = 0;
                lastFps = now;
            }
        }

        // Main loop
        function loop(now) {
            requestAnimationFrame(loop);
            const dt = Math.min((now - lastTime) / 16.67, 3);
            lastTime = now;
            updateFps(now);
            drawBackground();
            updateParticles(dt);
            drawParticles();
        }
        requestAnimationFrame(loop);

        // Mouse
        document.addEventListener('mousemove', e => {
            const x = e.clientX, y = e.clientY;
            mouse.x = x; mouse.y = y; mouse.active = true;
            ring.style.left = x + 'px';
            ring.style.top = y + 'px';
            dot.style.left = x + 'px';
            dot.style.top = y + 'px';
        });

        document.addEventListener('mouseleave', () => { mouse.active = false; });

        // Touch
        document.addEventListener('touchmove', e => {
            const t = e.touches[0];
            mouse.x = t.clientX; mouse.y = t.clientY; mouse.active = true;
        }, { passive: true });
        document.addEventListener('touchend', () => { mouse.active = false; });

        // Cursor hover over panel
        document.querySelectorAll('.control-panel *').forEach(el => {
            el.addEventListener('mouseenter', () => {
                ring.style.width = '14px'; ring.style.height = '14px';
                ring.style.borderColor = 'rgba(168,85,247,0.9)';
            });
            el.addEventListener('mouseleave', () => {
                ring.style.width = '36px'; ring.style.height = '36px';
                ring.style.borderColor = 'rgba(0,255,231,0.85)';
            });
        });

        // Controls
        function makeSlider(id, valId, transform, setter) {
            const el = document.getElementById(id);
            const vEl = document.getElementById(valId);
            el.addEventListener('input', () => {
                const v = transform(el.value);
                vEl.textContent = v.toFixed ? v.toFixed(2) : v;
                setter(v);
            });
            // init display
            const initV = transform(el.value);
            vEl.textContent = initV.toFixed ? initV.toFixed(2) : initV;
        }

        makeSlider('count-slider', 'count-val', v => parseInt(v), v => {
            state.count = v;
            while (particles.length < v) particles.push(createParticle());
            while (particles.length > v) particles.pop();
        });
        document.getElementById('count-val').textContent = state.count;

        makeSlider('speed-slider', 'speed-val', v => (parseFloat(v) / 10).toFixed(1), v => { state.speed = parseFloat(v); });
        makeSlider('attract-slider', 'attract-val', v => (parseFloat(v) / 10).toFixed(1), v => { state.attraction = parseFloat(v); });
        makeSlider('dist-slider', 'dist-val', v => parseInt(v), v => { state.distThreshold = v; });
        document.getElementById('dist-val').textContent = state.distThreshold;
        makeSlider('tail-slider', 'tail-val', v => (parseFloat(v) / 100).toFixed(2), v => { state.tail = parseFloat(v); });

        // Palette swatches
        document.querySelectorAll('.swatch').forEach(s => {
            s.addEventListener('click', () => {
                document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
                s.classList.add('active');
                state.palette = s.dataset.palette;
                recolorParticles();
            });
        });

        // Toggle buttons
        function makeToggle(id, key) {
            const btn = document.getElementById(id);
            btn.addEventListener('click', () => {
                state[key] = !state[key];
                btn.classList.toggle('active', state[key]);
            });
        }
        makeToggle('btn-lines', 'showLines');
        makeToggle('btn-glow', 'glow');
        makeToggle('btn-repel', 'repel');
        makeToggle('btn-drift', 'drift');

    })();
</script>
</body>
</html>
