<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2D Cellular Automata Sandbox</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #111; user-select: none; }
    #ui-layer {
      position: absolute; top: 15px; left: 15px; width: 280px;
      background: rgba(30, 30, 30, 0.9); color: #fff;
      padding: 20px; border-radius: 8px; font-family: sans-serif;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8); z-index: 100;
      border: 1px solid #444; backdrop-filter: blur(5px);
    }
    h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #666; padding-bottom: 10px; color: #ffeb3b; }
    .instruction { font-size: 12px; line-height: 1.5; margin-bottom: 15px; color: #ccc; }

    .palette { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
    .element-btn {
      flex: 1 1 45%; padding: 10px 0; background: #333; color: #fff;
      border: 1px solid #555; border-radius: 4px; text-align: center;
      cursor: pointer; transition: 0.2s; font-size: 13px; font-weight: bold;
    }
    .element-btn.active { background: #555; border-color: #fff; }

    .control-group { margin-bottom: 15px; }
    label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; color: #ddd; }
    input[type=range] { width: 100%; cursor: pointer; accent-color: #ffeb3b; }

    #btn-clear {
      width: 100%; padding: 10px; background: #e53935; color: white;
      border: none; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: bold;
    }
    #btn-clear:hover { background: #f44336; }

    canvas {
      display: block;
      width: 100vw; height: 100vh;
      image-rendering: pixelated; /* 흐릿해짐 방지, 도트 렌더링 강제 */
    }

    @media (max-width: 560px) {
      #ui-layer { display: none; }
    }
  </style>
</head>
<body>
<div id="ui-layer">
  <h2>원소 입자 샌드박스</h2>
  <div class="instruction">
    마우스로 드래그하여 원소를 그리고, 입자 간의 상호작용 및 상태 변화를 관찰하십시오.
  </div>

  <div class="palette" id="palette">
    <button class="element-btn active" data-type="1" style="border-left: 5px solid #e6c27a;">모래</button>
    <button class="element-btn" data-type="2" style="border-left: 5px solid #42a5f5;">물</button>
    <button class="element-btn" data-type="3" style="border-left: 5px solid #795548;">나무</button>
    <button class="element-btn" data-type="40" style="border-left: 5px solid #f44336;">불</button>
    <button class="element-btn" data-type="0" style="border-left: 5px solid #111;">지우개</button>
  </div>

  <div class="control-group">
    <label><span>브러시 크기</span> <span id="val-brush">4</span></label>
    <input type="range" id="inp-brush" min="1" max="15" step="1" value="4">
  </div>

  <button id="btn-clear">화면 전체 초기화</button>
</div>

<canvas id="sandbox"></canvas>

<script>
  const canvas = document.getElementById('sandbox');
  const ctx = canvas.getContext('2d', { alpha: false }); // 알파 채널 비활성화로 렌더링 최적화

  // 연산 부하를 제어하기 위한 가상 해상도 (Virtual Resolution)
  const COLS = 250;
  const ROWS = 250;

  canvas.width = COLS;
  canvas.height = ROWS;

  // 메모리 정렬 배열을 사용하여 가비지 컬렉션(GC) 최소화
  let grid = new Uint8Array(COLS * ROWS);
  const imageData = ctx.createImageData(COLS, ROWS);

  let currentElement = 1;
  let isPainting = false;
  let mouseX = 0;
  let mouseY = 0;

  // UI 이벤트 바인딩
  document.querySelectorAll('.element-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.element-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentElement = parseInt(e.target.getAttribute('data-type'));
    });
  });

  const inpBrush = document.getElementById('inp-brush');
  inpBrush.addEventListener('input', () => {
    document.getElementById('val-brush').textContent = inpBrush.value;
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    grid.fill(0);
  });

  // 캔버스 마우스 입력 좌표 매핑 연산
  function getGridPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = Math.floor((clientX - rect.left) * scaleX);
    const y = Math.floor((clientY - rect.top) * scaleY);
    return { x, y };
  }

  function paint() {
    if (!isPainting) return;
    const brushSize = parseInt(inpBrush.value);
    const rSq = brushSize * brushSize;

    for (let dy = -brushSize; dy <= brushSize; dy++) {
      for (let dx = -brushSize; dx <= brushSize; dx++) {
        if (dx * dx + dy * dy <= rSq) {
          const nx = mouseX + dx;
          const ny = mouseY + dy;
          if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
            const idx = ny * COLS + nx;
            // 불(Fire)의 경우 생명력을 난수로 부여
            if (currentElement === 40) {
              grid[idx] = 40 + Math.floor(Math.random() * 10);
            } else {
              grid[idx] = currentElement;
            }
          }
        }
      }
    }
  }

  canvas.addEventListener('mousedown', (e) => { isPainting = true; const pos = getGridPos(e.clientX, e.clientY); mouseX = pos.x; mouseY = pos.y; paint(); });
  canvas.addEventListener('mousemove', (e) => { const pos = getGridPos(e.clientX, e.clientY); mouseX = pos.x; mouseY = pos.y; paint(); });
  window.addEventListener('mouseup', () => { isPainting = false; });

  // 모바일 터치 지원
  canvas.addEventListener('touchstart', (e) => { isPainting = true; const pos = getGridPos(e.touches[0].clientX, e.touches[0].clientY); mouseX = pos.x; mouseY = pos.y; paint(); }, {passive: true});
  canvas.addEventListener('touchmove', (e) => { const pos = getGridPos(e.touches[0].clientX, e.touches[0].clientY); mouseX = pos.x; mouseY = pos.y; paint(); }, {passive: true});
  window.addEventListener('touchend', () => { isPainting = false; });

  // 셀룰러 오토마타 메인 물리 로직
  function swap(i, j) {
    // 모래가 물로 떨어지면 질량 차이로 인해 물을 위로 밀어냄 (밀도 변환)
    if (grid[i] === 1 && grid[j] === 2) {
      grid[i] = 2;
      grid[j] = 1;
    } else {
      const temp = grid[i];
      grid[i] = grid[j];
      grid[j] = temp;
    }
  }

  function updateGrid() {
    // 입자가 한 방향으로만 치우쳐 흐르는 현상을 막기 위해 X축 스캔 방향을 난수로 결정
    const dir = Math.random() < 0.5 ? 1 : -1;

    // Y축 하단부터 순회 (Bottom-up Traversal)
    for (let y = ROWS - 1; y >= 0; y--) {
      const startX = dir === 1 ? 0 : COLS - 1;
      const endX = dir === 1 ? COLS : -1;

      for (let x = startX; x !== endX; x += dir) {
        const idx = y * COLS + x;
        const type = grid[idx];

        if (type === 0 || type === 3) continue; // 빈 공간 또는 고체(나무) 연산 생략

        // 1. 모래 로직
        if (type === 1) {
          if (y < ROWS - 1) {
            const down = idx + COLS;
            if (grid[down] === 0 || grid[down] === 2) {
              swap(idx, down);
            } else {
              const leftOk = x > 0 && (grid[down - 1] === 0 || grid[down - 1] === 2);
              const rightOk = x < COLS - 1 && (grid[down + 1] === 0 || grid[down + 1] === 2);

              if (leftOk && rightOk) {
                swap(idx, Math.random() < 0.5 ? down - 1 : down + 1);
              } else if (leftOk) {
                swap(idx, down - 1);
              } else if (rightOk) {
                swap(idx, down + 1);
              }
            }
          }
        }
        // 2. 물 로직 (유체 확산)
        else if (type === 2) {
          if (y < ROWS - 1) {
            const down = idx + COLS;
            if (grid[down] === 0) {
              swap(idx, down);
            } else {
              const leftOk = x > 0 && grid[down - 1] === 0;
              const rightOk = x < COLS - 1 && grid[down + 1] === 0;

              if (leftOk && rightOk) swap(idx, Math.random() < 0.5 ? down - 1 : down + 1);
              else if (leftOk) swap(idx, down - 1);
              else if (rightOk) swap(idx, down + 1);
              else {
                // 하단 대각선마저 막히면 수평 이동
                const hLeftOk = x > 0 && grid[idx - 1] === 0;
                const hRightOk = x < COLS - 1 && grid[idx + 1] === 0;
                if (hLeftOk && hRightOk) swap(idx, Math.random() < 0.5 ? idx - 1 : idx + 1);
                else if (hLeftOk) swap(idx, idx - 1);
                else if (hRightOk) swap(idx, idx + 1);
              }
            }
          } else {
            // 바닥에 닿았을 때 수평 확산
            const hLeftOk = x > 0 && grid[idx - 1] === 0;
            const hRightOk = x < COLS - 1 && grid[idx + 1] === 0;
            if (hLeftOk && hRightOk) swap(idx, Math.random() < 0.5 ? idx - 1 : idx + 1);
            else if (hLeftOk) swap(idx, idx - 1);
            else if (hRightOk) swap(idx, idx + 1);
          }
        }
        // 3. 불 로직 및 연소 반응 (상태 전이)
        else if (type >= 40) {
          if (type === 40) {
            grid[idx] = 0; // 수명 종료
          } else {
            grid[idx]--; // 수명 감소

            // 위로 상승하려는 성질
            if (y > 0) {
              const up = idx - COLS;
              if (grid[up] === 0) {
                swap(idx, up);
              } else {
                const upLeftOk = x > 0 && grid[up - 1] === 0;
                const upRightOk = x < COLS - 1 && grid[up + 1] === 0;
                if (upLeftOk && upRightOk) swap(idx, Math.random() < 0.5 ? up - 1 : up + 1);
                else if (upLeftOk) swap(idx, up - 1);
                else if (upRightOk) swap(idx, up + 1);
              }
            }

            // 인접 셀 검사 (나무 연소 및 물 증발)
            const neighbors = [];
            if (y > 0) neighbors.push(idx - COLS);
            if (y < ROWS - 1) neighbors.push(idx + COLS);
            if (x > 0) neighbors.push(idx - 1);
            if (x < COLS - 1) neighbors.push(idx + 1);

            for (let n of neighbors) {
              if (grid[n] === 3) {
                if (Math.random() < 0.05) grid[n] = 50; // 나무 발화
              } else if (grid[n] === 2) {
                if (Math.random() < 0.1) {
                  grid[idx] = 0; // 불 꺼짐
                  grid[n] = 0; // 물 증발
                }
              }
            }
          }
        }
      }
    }
  }

  // 렌더링 데이터 버퍼 매핑 연산
  function renderGrid() {
    const data = imageData.data;
    for (let i = 0; i < grid.length; i++) {
      const type = grid[i];
      const px = i * 4; // RGBA

      if (type === 0) {
        data[px] = 17; data[px+1] = 17; data[px+2] = 17; data[px+3] = 255;
      } else if (type === 1) {
        data[px] = 230; data[px+1] = 194; data[px+2] = 122; data[px+3] = 255;
      } else if (type === 2) {
        data[px] = 66; data[px+1] = 165; data[px+2] = 245; data[px+3] = 255;
      } else if (type === 3) {
        data[px] = 121; data[px+1] = 85; data[px+2] = 72; data[px+3] = 255;
      } else if (type >= 40) {
        // 수명(40~50)에 따라 빨간색에서 노란색으로 동적 변경
        const intensity = (type - 40) / 10;
        data[px] = 255;
        data[px+1] = Math.floor(intensity * 235);
        data[px+2] = 0;
        data[px+3] = 255;
      }
    }
    ctx.putImageData(imageData, 0, 0);
  }

  // 프레임 루프
  function animate() {
    requestAnimationFrame(animate);
    updateGrid();
    renderGrid();
  }
  animate();
</script>
</body>
</html>
