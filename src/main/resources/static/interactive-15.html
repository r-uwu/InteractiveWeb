<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Advanced Particle Sandbox</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #08080a; user-select: none; }
    #ui-layer {
      position: absolute; top: 15px; left: 15px; width: 300px;
      background: rgba(15, 15, 20, 0.95); color: #f0f0f0;
      padding: 20px; border-radius: 12px; font-family: sans-serif;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7); z-index: 100;
      border: 1px solid #444; backdrop-filter: blur(10px);
    }
    h2 { margin-top: 0; font-size: 18px; border-bottom: 2px solid #ff5722; padding-bottom: 10px; color: #ff5722; letter-spacing: -0.5px; }
    .instruction { font-size: 12px; line-height: 1.6; margin-bottom: 15px; color: #aaa; }

    .palette { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 15px; }
    .element-btn {
      padding: 8px 0; background: #222; color: #fff;
      border: 1px solid #444; border-radius: 6px; text-align: center;
      cursor: pointer; transition: 0.2s; font-size: 11px; font-weight: 600;
    }
    .element-btn.active { background: #ff5722; border-color: #fff; color: #000; }

    .control-group { margin-bottom: 15px; }
    label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; color: #ccc; }
    input[type=range] { width: 100%; cursor: pointer; accent-color: #ff5722; }

    #btn-clear {
      width: 100%; padding: 10px; background: transparent; color: #ff3e3e;
      border: 1px solid #ff3e3e; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold;
      transition: 0.3s;
    }
    #btn-clear:hover { background: #ff3e3e; color: #fff; }

    canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }

    @media (max-width: 560px) { #ui-layer { display: none; } }
  </style>
</head>
<body>
<div id="ui-layer">
  <h2>익스트림 입자 시뮬레이터</h2>
  <div class="instruction">
    - <b>용암 + 모래:</b> 영롱한 <b>유리</b> 생성<br>
    - <b>용암 + 물:</b> 단단한 <b>흑요석</b>과 거센 수증기<br>
    - <b>응결:</b> 하늘로 올라간 수증기는 다시 <b>물</b>이 됨
  </div>

  <div class="palette" id="palette">
    <button class="element-btn" data-type="1">모래</button>
    <button class="element-btn" data-type="2">물</button>
    <button class="element-btn" data-type="3">나무</button>
    <button class="element-btn active" data-type="4">용암</button>
    <button class="element-btn" data-type="5">수증기</button>
    <button class="element-btn" data-type="6">흑요석</button>
    <button class="element-btn" data-type="7">유리</button>
    <button class="element-btn" data-type="0">지우개</button>
  </div>

  <div class="control-group">
    <label><span>브러시 크기</span> <span id="val-brush">6</span></label>
    <input type="range" id="inp-brush" min="1" max="20" step="1" value="6">
  </div>

  <button id="btn-clear">리셋</button>
</div>

<canvas id="sandbox"></canvas>

<script type="module">
  const canvas = document.getElementById('sandbox');
  const ctx = canvas.getContext('2d', { alpha: false });

  // 연산용 가상 해상도 설정
  const COLS = 200;
  const ROWS = 200;
  canvas.width = COLS;
  canvas.height = ROWS;

  let grid = new Uint8Array(COLS * ROWS);
  let updated = new Uint8Array(COLS * ROWS);
  const imageData = ctx.createImageData(COLS, ROWS);

  let currentElement = 4;
  let isPainting = false;
  let mouseX = 0, mouseY = 0;

  // UI 이벤트 바인딩
  document.querySelectorAll('.element-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.element-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentElement = parseInt(btn.getAttribute('data-type'));
    });
  });

  const inpBrush = document.getElementById('inp-brush');
  const valBrush = document.getElementById('val-brush');
  inpBrush.addEventListener('input', () => { valBrush.textContent = inpBrush.value; });
  document.getElementById('btn-clear').addEventListener('click', () => { grid.fill(0); });

  // 화면 좌표를 그리드 좌표로 변환
  function getGridPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: Math.floor((clientX - rect.left) * (COLS / rect.width)),
      y: Math.floor((clientY - rect.top) * (ROWS / rect.height))
    };
  }

  // 반응형 브러시 로직
  function paintAtCell(idx, x, y, brushType) {
    const target = grid[idx];
    if (brushType === 0) { grid[idx] = 0; return; }
    if (target === 6 || target === 7) return;

    // 물질 간 즉각 반응 로직
    if (brushType === 4 && target === 2) { // 용암 -> 물 덮어쓰기
      grid[idx] = 6;
      spawnSteam(x, y, 3);
      return;
    }
    if (brushType === 4 && target === 1) { // 용암 -> 모래 덮어쓰기
      grid[idx] = 7;
      return;
    }
    if (brushType === 1 && target === 2) { // 모래 -> 물 덮어쓰기 (밀도 변위)
      grid[idx] = 1;
      if (y > 0 && grid[idx-COLS] === 0) grid[idx-COLS] = 2;
      return;
    }

    if (target === 0) grid[idx] = brushType;
  }

  // 수증기 생성 함수
  function spawnSteam(x, y, count) {
    for(let i=0; i<count; i++) {
      const nx = x + Math.floor(Math.random()*5-2);
      const ny = y + Math.floor(Math.random()*5-2);
      if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
        const nidx = ny * COLS + nx;
        if (grid[nidx] === 0) grid[nidx] = 5;
      }
    }
  }

  // 캔버스 드로잉 루프
  function paint() {
    if (!isPainting) return;
    const size = parseInt(inpBrush.value);
    for (let dy = -size; dy <= size; dy++) {
      for (let dx = -size; dx <= size; dx++) {
        if (dx*dx + dy*dy <= size*size) {
          const nx = mouseX + dx, ny = mouseY + dy;
          if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
            paintAtCell(ny * COLS + nx, nx, ny, currentElement);
          }
        }
      }
    }
  }

  // 입력 리스너 설정
  canvas.addEventListener('mousedown', (e) => { isPainting = true; const p = getGridPos(e.clientX, e.clientY); mouseX = p.x; mouseY = p.y; paint(); });
  canvas.addEventListener('mousemove', (e) => { const p = getGridPos(e.clientX, e.clientY); mouseX = p.x; mouseY = p.y; paint(); });
  window.addEventListener('mouseup', () => isPainting = false);
  canvas.addEventListener('touchstart', (e) => { isPainting = true; const p = getGridPos(e.touches[0].clientX, e.touches[0].clientY); mouseX = p.x; mouseY = p.y; paint(); }, {passive:false});
  canvas.addEventListener('touchmove', (e) => { const p = getGridPos(e.touches[0].clientX, e.touches[0].clientY); mouseX = p.x; mouseY = p.y; paint(); }, {passive:false});

  // 위치 교환 함수
  function swap(a, b) {
    const t = grid[a]; grid[a] = grid[b]; grid[b] = t;
    updated[a] = 1; updated[b] = 1;
  }

  // 메인 물리 엔진 루프
  function updateGrid() {
    updated.fill(0);
    const dir = Math.random() < 0.5 ? 1 : -1;

    for (let y = ROWS - 1; y >= 0; y--) {
      for (let x = (dir === 1 ? 0 : COLS - 1); (dir === 1 ? x < COLS : x >= 0); x += dir) {
        const idx = y * COLS + x;
        const type = grid[idx];

        if (type === 0 || updated[idx] || type === 3 || type === 6 || type === 7) continue;

        // 1. 모래 로직
        if (type === 1) {
          const down = idx + COLS;
          if (y < ROWS-1 && (grid[down] === 0 || grid[down] === 2 || grid[down] === 4 || grid[down] === 5)) swap(idx, down);
          else if (y < ROWS-1 && x > 0 && (grid[down-1] === 0 || grid[down-1] === 2)) swap(idx, down-1);
          else if (y < ROWS-1 && x < COLS-1 && (grid[down+1] === 0 || grid[down+1] === 2)) swap(idx, down+1);
        }
        // 2. 물 로직
        else if (type === 2) {
          const down = idx + COLS;
          if (y < ROWS-1 && (grid[down] === 0 || grid[down] === 5)) swap(idx, down);
          else {
            const left = x > 0 && (grid[idx-1] === 0 || grid[idx-1] === 5);
            const right = x < COLS-1 && (grid[idx+1] === 0 || grid[idx+1] === 5);
            if (left && right) swap(idx, Math.random() < 0.5 ? idx-1 : idx+1);
            else if (left) swap(idx, idx-1);
            else if (right) swap(idx, idx+1);
          }
        }
        // 3. 용암 로직 (화학 반응 포함)
        else if (type === 4) {
          let reacted = false;
          const neighbors = [idx-1, idx+1, idx-COLS, idx+COLS];
          for(let n of neighbors) {
            if (grid[n] === 2) { grid[idx] = 6; grid[n] = 5; reacted = true; break; }
            if (grid[n] === 1) { grid[n] = 7; reacted = true; break; }
            if (grid[n] === 3) { grid[n] = 0; reacted = true; break; }
          }
          if (reacted) continue;

          const down = idx + COLS;
          if (y < ROWS-1 && (grid[down] === 0 || grid[down] === 5)) swap(idx, down);
          else if (Math.random() < 0.3) {
            const left = x > 0 && (grid[idx-1] === 0 || grid[idx-1] === 5);
            const right = x < COLS-1 && (grid[idx+1] === 0 || grid[idx+1] === 5);
            if (left && right) swap(idx, Math.random() < 0.5 ? idx-1 : idx+1);
            else if (left) swap(idx, idx-1);
            else if (right) swap(idx, idx+1);
          }
        }
        // 4. 수증기 로직 (응결 포함)
        else if (type === 5) {
          if (Math.random() < 0.01) { grid[idx] = 2; continue; }
          const up = idx - COLS;
          if (y > 0 && grid[up] === 0) { grid[up] = 5; grid[idx] = 0; updated[up] = 1; }
          else if (x > 0 && grid[idx-1] === 0 && Math.random() < 0.5) swap(idx, idx-1);
          else if (x < COLS-1 && grid[idx+1] === 0 && Math.random() < 0.5) swap(idx, idx+1);
        }
      }
    }
  }

  // 픽셀 렌더링 파이프라인
  function render() {
    const d = imageData.data;
    for (let i = 0; i < grid.length; i++) {
      const type = grid[i];
      const p = i * 4;
      if (type === 0) { d[p]=10; d[p+1]=10; d[p+2]=15; }
      else if (type === 1) { d[p]=230; d[p+1]=194; d[p+2]=122; }
      else if (type === 2) { d[p]=66; d[p+1]=165; d[p+2]=245; }
      else if (type === 3) { d[p]=121; d[p+1]=85; d[p+2]=72; }
      else if (type === 4) { d[p]=255; d[p+1]=87; d[p+2]=34; }
      else if (type === 5) { d[p]=200; d[p+1]=220; d[p+2]=230; }
      else if (type === 6) { d[p]=40; d[p+1]=20; d[p+2]=60; }
      else if (type === 7) { d[p]=150; d[p+1]=240; d[p+2]=255; }
      d[p+3] = 255; // 알파 채널 불투명 처리
    }
    ctx.putImageData(imageData, 0, 0);
  }

  // 애니메이션 초기화 및 실행
  function loop() {
    updateGrid();
    render();
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
