<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삐약이 간식 시간</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #e8f5e9;
            /* 따뜻하고 평화로운 잔디밭 색상 */
            font-family: 'Comic Sans MS', '맑은 고딕', sans-serif;
            cursor: crosshair;
            /* 모이를 주는 느낌을 위해 마우스 커서 변경 */
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #2e7d32;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.15);
        }

        h2 {
            margin: 0 0 5px 0;
        }

        p {
            margin: 0;
            font-size: 14px;
            font-weight: bold;
            color: #ff5252;
        }
    </style>
</head>

<body>
<div id="info">
    <h2>🐥 삐약이 간식 시간</h2>
    <p>화면을 클릭해서 모이를 뿌려주세요!</p>
</div>
<canvas id="chickCanvas"></canvas>

<script>
    const canvas = document.getElementById('chickCanvas');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;
    const chicks = [];
    const seeds = [];
    const numChicks = 35;
    // 화면을 클릭하면 모이(씨앗)가 3~5개 무작위로 흩뿌려집니다
    window.addEventListener('mousedown', (e) => {
        let seedCount = Math.floor(Math.random() * 3) + 3;
        for (let i = 0; i < seedCount; i++) {
            seeds.push({
                x: e.clientX + (Math.random() - 0.5) * 40,
                y: e.clientY + (Math.random() - 0.5) * 40,
            });
        }
    });
    class Chick {
        constructor() {
            // 1. 크기가 각기 다름 (12 ~ 24)
            this.r = Math.random() * 12 + 12;
            this.x = Math.random() * w;
            this.y = Math.random() * h;
            // 2. 핵심 로직: 크기가 작을수록 최대 속도가 빠름! (속도 편차 생성)
            // 40을 반지름으로 나누어, 뚱뚱하면 느리고 작으면 날래게 만듭니다.
            this.maxSpeed = (40 / this.r) + (Math.random() * 1);
            this.vx = (Math.random() - 0.5) * this.maxSpeed;
            this.vy = (Math.random() - 0.5) * this.maxSpeed;
            this.walkCycle = Math.random() * Math.PI * 2;
            this.isHappy = 0; // 모이를 먹었을 때 멈춰있는 시간
        }
        update() {
            // 모이를 먹고 행복한 상태면 움직이지 않고 소화시킴
            if (this.isHappy > 0) {
                this.isHappy--;
                this.vx = 0;
                this.vy = 0;
                return;
            }
            let closestSeed = null;
            let recordDist = Infinity;
            // 시야에 모이가 있는지 탐색
            for (let i = 0; i < seeds.length; i++) {
                let dx = seeds[i].x - this.x;
                let dy = seeds[i].y - this.y;
                let d = Math.sqrt(dx * dx + dy * dy);
                if (d < recordDist) {
                    recordDist = d;
                    closestSeed = seeds[i];
                }
            }
            // 모이가 발견되면 그쪽으로 전력 질주
            if (closestSeed) {
                let dx = closestSeed.x - this.x;
                let dy = closestSeed.y - this.y;
                let mag = Math.sqrt(dx * dx + dy * dy);
                // 목표를 향한 방향 벡터에 최대 속도를 곱함
                let desiredVx = (dx / mag) * this.maxSpeed;
                let desiredVy = (dy / mag) * this.maxSpeed;
                // 부드럽게 가속하며 방향 전환 (조향력)
                this.vx = this.vx * 0.85 + desiredVx * 0.15;
                this.vy = this.vy * 0.85 + desiredVy * 0.15;
                // 모이에 도착했으면 꿀꺽 먹음!
                if (recordDist < this.r + 5) {
                    let index = seeds.indexOf(closestSeed);
                    if (index > -1) {
                        seeds.splice(index, 1); // 화면에서 모이 제거
                        this.isHappy = 40; // 40프레임 동안 정지하고 하트 띄움
                    }
                }
            } else {
                // 모이가 없으면 평화롭게 산책 (무작위 움직임)
                this.vx += (Math.random() - 0.5) * 0.5;
                this.vy += (Math.random() - 0.5) * 0.5;
                // 산책할 때는 전력 질주 속도의 절반만 냄
                let mag = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                let walkSpeed = this.maxSpeed * 0.4;
                if (mag > walkSpeed) {
                    this.vx = (this.vx / mag) * walkSpeed;
                    this.vy = (this.vy / mag) * walkSpeed;
                }
            }
            // 화면 밖으로 나가지 않게 튕겨내기
            if (this.x < this.r || this.x > w - this.r) this.vx *= -1;
            if (this.y < this.r || this.y > h - this.r) this.vy *= -1;
            this.x += this.vx;
            this.y += this.vy;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            // 속도가 빠를수록 뒤뚱거림(Waddle)도 빨라짐
            let speedMag = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
            let waddle = 0;
            if (speedMag > 0.2 && this.isHappy === 0) {
                this.walkCycle += speedMag * 0.15;
                waddle = Math.sin(this.walkCycle) * 0.25;
            }
            // 걷는 방향에 따라 몸통 뒤집기 (왼쪽을 향하면 좌우 반전)
            if (this.vx < 0) {
                ctx.scale(-1, 1);
            }
            ctx.rotate(waddle);
            // 1. 몸통 (통통한 노란색)
            ctx.fillStyle = '#ffeaa7';
            ctx.beginPath();
            ctx.arc(0, 0, this.r, 0, Math.PI * 2);
            ctx.fill();
            // 2. 까만 콩 눈
            ctx.fillStyle = '#2d3436';
            ctx.beginPath();
            ctx.arc(this.r * 0.35, -this.r * 0.2, this.r * 0.15, 0, Math.PI * 2);
            ctx.fill();
            // 3. 주황색 부리
            ctx.fillStyle = '#fab1a0';
            ctx.beginPath();
            ctx.moveTo(this.r * 0.75, 0);
            ctx.lineTo(this.r * 1.3, this.r * 0.1);
            ctx.lineTo(this.r * 0.75, this.r * 0.25);
            ctx.fill();
            // 4. 모이를 먹었을 때 띄우는 하트
            if (this.isHappy > 0) {
                ctx.fillStyle = '#ff7675';
                ctx.font = `${this.r}px Arial`;
                ctx.fillText('❤', -this.r * 0.4, -this.r - 5);
            }
            ctx.restore();
        }
    }
    // 초기 생성
    for (let i = 0; i < numChicks; i++) {
        chicks.push(new Chick());
    }

    function animate() {
        ctx.clearRect(0, 0, w, h);
        // 땅에 떨어진 모이들 먼저 그리기
        ctx.fillStyle = '#8d6e63'; // 갈색
        for (let seed of seeds) {
            ctx.beginPath();
            ctx.ellipse(seed.x, seed.y, 4, 2, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        // 삐약이들 업데이트 및 그리기 (뚱뚱한 애들이 뒤로 가게 정렬하면 더 자연스럽지만 생략)
        for (let chick of chicks) {
            chick.update();
            chick.draw();
        }
        requestAnimationFrame(animate);
    }
    animate();
    window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    });
</script>
</body>

</html>
