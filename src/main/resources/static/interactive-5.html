<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D Fractal Forest - Local Rotation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; user-select: none; }
        #ui-layer {
            position: absolute; top: 15px; left: 15px; width: 320px;
            background: rgba(15, 15, 25, 0.9); color: #fff;
            padding: 20px; border-radius: 8px; font-family: sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); z-index: 100;
            border: 1px solid #333;
        }
        h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #444; padding-bottom: 10px; color: #4caf50; }
        .instruction { font-size: 13px; line-height: 1.5; margin-bottom: 15px; color: #aaa; }
        .control-group { margin-bottom: 15px; }
        label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; color: #ddd; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #4caf50; }
        select { width: 100%; padding: 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; outline: none; }
        button {
            width: 100%; padding: 10px; background: #4caf50; color: white;
            border: none; border-radius: 4px; font-size: 14px; cursor: pointer;
            transition: background 0.2s; margin-top: 5px;
        }
        button:hover { background: #45a049; }

        @media (max-width: 560px) {
            #ui-layer {
                display: none;
            }
        }
    </style>
</head>
<body>
<div id="ui-layer">
    <h2>프랙탈 가로수길 뷰어</h2>
    <div class="instruction">
        <strong>좌클릭 드래그:</strong> 개별 나무 제자리 회전<br>
        <strong>우클릭 드래그:</strong> 카메라 수평 이동 (X축)<br>
        <strong>마우스 휠:</strong> 카메라 줌 인/아웃
    </div>

    <div class="control-group">
        <label><span>반복 횟수 (Depth)</span> <span id="val-depth">5</span></label>
        <input type="range" id="inp-depth" min="2" max="6" step="1" value="5">
    </div>
    <div class="control-group">
        <label><span>가지치기 각도 (Angle)</span> <span id="val-angle">35°</span></label>
        <input type="range" id="inp-angle" min="10" max="60" step="1" value="35">
    </div>
    <div class="control-group">
        <label><span>길이 감소율 (Length)</span> <span id="val-len">0.75</span></label>
        <input type="range" id="inp-len" min="0.5" max="0.85" step="0.01" value="0.75">
    </div>
    <div class="control-group">
        <label><span>나뭇잎 색상</span></label>
        <select id="inp-color">
            <option value="0x2e8b57">여름 (초록)</option>
            <option value="0xffb7c5">봄 (벚꽃)</option>
            <option value="0xd2691e">가을 (단풍)</option>
            <option value="0xffffff">겨울 (눈꽃)</option>
        </select>
    </div>

    <button id="btn-random">형태 무작위 변형 (Random Seed)</button>
</div>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.1/build/three.module.js"
      }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1a1a2e, 0.015);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 60);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(20, 50, 30);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const planeGeo = new THREE.PlaneGeometry(500, 500);
    planeGeo.rotateX(-Math.PI / 2);
    const planeMat = new THREE.MeshLambertMaterial({ color: 0x151520 });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.receiveShadow = true;
    scene.add(plane);

    const branchGeo = new THREE.CylinderGeometry(0.08, 0.12, 1, 6);
    branchGeo.translate(0, 0.5, 0);
    const branchMat = new THREE.MeshLambertMaterial({ color: 0x3d2817 });

    const leafGeo = new THREE.SphereGeometry(0.5, 5, 5);
    leafGeo.translate(0, 0.5, 0);
    const leafMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });

    let treeGroups = [];
    let randomFactor = 0.5;

    function buildBranch(level, maxDepth, matrix, angleRad, lenMult, branchMatrices, leafMatrices) {
        branchMatrices.push(matrix.clone());

        if (level >= maxDepth) {
            const leafMatrix = matrix.clone();
            leafMatrix.multiply(new THREE.Matrix4().makeScale(1.5, 1.5, 1.5));
            leafMatrices.push(leafMatrix);
            return;
        }

        const branchesPerNode = 3;

        for (let i = 0; i < branchesPerNode; i++) {
            const randAngleY = (Math.random() - 0.5) * randomFactor * 2;
            const randAngleZ = (Math.random() - 0.5) * randomFactor;

            const childMatrix = matrix.clone();
            childMatrix.multiply(new THREE.Matrix4().makeTranslation(0, 1, 0));
            childMatrix.multiply(new THREE.Matrix4().makeRotationY((Math.PI * 2 / branchesPerNode) * i + randAngleY));
            childMatrix.multiply(new THREE.Matrix4().makeRotationZ(angleRad + randAngleZ));
            childMatrix.multiply(new THREE.Matrix4().makeScale(0.75, lenMult, 0.75));

            buildBranch(level + 1, maxDepth, childMatrix, angleRad, lenMult, branchMatrices, leafMatrices);
        }
    }

    function generateForest() {
        treeGroups.forEach(group => {
            scene.remove(group);
            group.children.forEach(mesh => {
                mesh.geometry.dispose();
            });
        });
        treeGroups = [];

        const maxDepth = parseInt(document.getElementById('inp-depth').value);
        const angleDeg = parseFloat(document.getElementById('inp-angle').value);
        const angleRad = THREE.MathUtils.degToRad(angleDeg);
        const lenMult = parseFloat(document.getElementById('inp-len').value);

        const numTrees = 9;
        const spacing = 15;
        const startX = -((numTrees - 1) * spacing) / 2;

        for (let i = 0; i < numTrees; i++) {
            const treeGroup = new THREE.Group();
            treeGroup.position.set(startX + i * spacing, 0, 0);

            const branchMatrices = [];
            const leafMatrices = [];

            const rootMatrix = new THREE.Matrix4();
            rootMatrix.multiply(new THREE.Matrix4().makeScale(3, 5, 3));

            buildBranch(0, maxDepth, rootMatrix, angleRad, lenMult, branchMatrices, leafMatrices);

            const branchInstancedMesh = new THREE.InstancedMesh(branchGeo, branchMat, branchMatrices.length);
            branchInstancedMesh.castShadow = true;
            branchInstancedMesh.receiveShadow = true;
            for(let j=0; j<branchMatrices.length; j++) branchInstancedMesh.setMatrixAt(j, branchMatrices[j]);
            treeGroup.add(branchInstancedMesh);

            const leafInstancedMesh = new THREE.InstancedMesh(leafGeo, leafMat, leafMatrices.length);
            leafInstancedMesh.castShadow = true;
            leafInstancedMesh.receiveShadow = true;
            for(let j=0; j<leafMatrices.length; j++) leafInstancedMesh.setMatrixAt(j, leafMatrices[j]);
            treeGroup.add(leafInstancedMesh);

            scene.add(treeGroup);
            treeGroups.push(treeGroup);
        }
    }

    let isLeftDragging = false;
    let isRightDragging = false;
    let prevMousePos = { x: 0, y: 0 };

    document.addEventListener('contextmenu', e => e.preventDefault());

    renderer.domElement.addEventListener('mousedown', (e) => {
        if (e.button === 0) isLeftDragging = true;
        if (e.button === 2) isRightDragging = true;
        prevMousePos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('mousemove', (e) => {
        const deltaX = e.clientX - prevMousePos.x;

        if (isLeftDragging) {
            treeGroups.forEach(group => {
                group.rotation.y += deltaX * 0.01;
            });
        }

        if (isRightDragging) {
            camera.position.x -= deltaX * 0.05;
        }

        prevMousePos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('mouseup', (e) => {
        if (e.button === 0) isLeftDragging = false;
        if (e.button === 2) isRightDragging = false;
    });

    renderer.domElement.addEventListener('wheel', (e) => {
        camera.position.z += e.deltaY * 0.05;
        camera.position.z = Math.max(10, Math.min(camera.position.z, 150));
    });

    const bindSlider = (id, valId) => {
        const el = document.getElementById(id);
        const display = document.getElementById(valId);
        el.addEventListener('input', () => {
            display.textContent = el.value + (id === 'inp-angle' ? '°' : '');
            generateForest();
        });
    };

    bindSlider('inp-depth', 'val-depth');
    bindSlider('inp-angle', 'val-angle');
    bindSlider('inp-len', 'val-len');

    document.getElementById('inp-color').addEventListener('change', (e) => {
        leafMat.color.setHex(parseInt(e.target.value, 16));
    });

    document.getElementById('btn-random').addEventListener('click', () => {
        randomFactor = Math.random() * 0.8 + 0.2;
        generateForest();
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    generateForest();

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
