<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>3D Voxel Art Builder</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            user-select: none;
        }

        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 300px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 20px;
            border-radius: 8px;
            font-family: sans-serif;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }

        h2 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .instruction {
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #555;
        }

        .palette {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-swatch {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s;
        }

        .color-swatch:hover {
            transform: scale(1.1);
        }

        .color-swatch.active {
            border-color: #000;
            transform: scale(1.1);
        }
    </style>
</head>

<body>
<div id="ui-layer">
    <h2>3D 복셀 아트 빌더</h2>
    <div class="instruction">
        <strong>좌클릭:</strong> 블록 설치<br>
        <strong>Shift + 좌클릭:</strong> 블록 삭제<br>
        <strong>드래그:</strong> 시점 회전 및 이동
    </div>
    <div class="palette" id="color-palette">
        <!-- Color swatches injected via JS -->
    </div>
</div>

<script type="importmap">
    {
        "imports": {
          "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }
      }
</script>

<script type="module">
    import * as THREE from 'three';
    import {
        OrbitControls
    } from 'three/addons/controls/OrbitControls.js';
    // Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
    camera.position.set(15, 20, 25);
    camera.lookAt(0, 0, 0);
    const renderer = new THREE.WebGLRenderer({
        antialias: true
    });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;
    // Lighting
    const ambientLight = new THREE.AmbientLight(0x606060);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(1, 0.75, 0.5).normalize();
    scene.add(directionalLight);
    // Grid and Base Plane
    const gridSize = 20;
    const gridHelper = new THREE.GridHelper(gridSize, gridSize);
    scene.add(gridHelper);
    const planeGeometry = new THREE.PlaneGeometry(gridSize, gridSize);
    planeGeometry.rotateX(-Math.PI / 2);
    const planeMaterial = new THREE.MeshBasicMaterial({
        visible: false
    });
    const plane = new THREE.Mesh(planeGeometry, planeMaterial);
    scene.add(plane);
    const objects = [plane];
    // Ghost Block (Roll-over)
    const rollOverGeo = new THREE.BoxGeometry(1, 1, 1);
    const rollOverMaterial = new THREE.MeshBasicMaterial({
        color: 0xff0000,
        opacity: 0.5,
        transparent: true
    });
    const rollOverMesh = new THREE.Mesh(rollOverGeo, rollOverMaterial);
    scene.add(rollOverMesh);
    // Voxel Block Geometry
    const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
    // Color Palette State
    const colors = [0xf44336, 0xff9800, 0xffeb3b, 0x4caf50, 0x2196f3, 0x9c27b0, 0x795548, 0x222222, 0xffffff];
    let activeColor = colors[0];
    // Build UI Palette
    const paletteContainer = document.getElementById('color-palette');
    colors.forEach((colorHex, index) => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        if (index === 0) swatch.classList.add('active');
        swatch.style.backgroundColor = '#' + colorHex.toString(16).padStart(6, '0');
        swatch.addEventListener('click', () => {
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
            swatch.classList.add('active');
            activeColor = colorHex;
            rollOverMaterial.color.setHex(activeColor);
        });
        paletteContainer.appendChild(swatch);
    });
    // Raycasting and Input State
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isDragging = false;
    let mouseDownPos = {
        x: 0,
        y: 0
    };
    document.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        mouseDownPos = {
            x: event.clientX,
            y: event.clientY
        };
        isDragging = false;
    });
    document.addEventListener('pointermove', (event) => {
        mouse.set((event.clientX / window.innerWidth) * 2 - 1, -(event.clientY / window.innerHeight) * 2 + 1);
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(objects, false);
        if (intersects.length > 0) {
            const intersect = intersects[0];
            rollOverMesh.position.copy(intersect.point).add(intersect.face.normal);
            rollOverMesh.position.divideScalar(1).floor().multiplyScalar(1).addScalar(0.5);
        }
        if (Math.abs(event.clientX - mouseDownPos.x) > 3 || Math.abs(event.clientY - mouseDownPos.y) > 3) {
            isDragging = true;
        }
    });
    document.addEventListener('pointerup', (event) => {
        if (event.button !== 0 || isDragging) return;
        mouse.set((event.clientX / window.innerWidth) * 2 - 1, -(event.clientY / window.innerHeight) * 2 + 1);
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(objects, false);
        if (intersects.length > 0) {
            const intersect = intersects[0];
            if (event.shiftKey) {
                if (intersect.object !== plane) {
                    scene.remove(intersect.object);
                    objects.splice(objects.indexOf(intersect.object), 1);
                }
            } else {
                const material = new THREE.MeshLambertMaterial({
                    color: activeColor
                });
                const voxel = new THREE.Mesh(cubeGeo, material);
                voxel.position.copy(intersect.point).add(intersect.face.normal);
                voxel.position.divideScalar(1).floor().multiplyScalar(1).addScalar(0.5);
                scene.add(voxel);
                objects.push(voxel);
            }
        }
    });
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>

</html>
