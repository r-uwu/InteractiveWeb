<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D Knowledge Graph Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0d1117; user-select: none; }
        #ui-layer {
            position: absolute; top: 15px; left: 15px; width: 320px;
            background: rgba(13, 17, 23, 0.85); color: #c9d1d9;
            padding: 20px; border-radius: 8px; font-family: sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8); z-index: 100;
            border: 1px solid #30363d; backdrop-filter: blur(5px);
        }
        h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #30363d; padding-bottom: 10px; color: #79c0ff; }
        .instruction { font-size: 13px; line-height: 1.5; margin-bottom: 15px; color: #8b949e; }

        @media (max-width: 560px) {
            #ui-layer { display: none; }
        }
    </style>
</head>
<body>
<div id="ui-layer">
    <h2>학습 개념망 (Knowledge Graph)</h2>
    <div class="instruction">
        물리 법칙 기반으로 노드들이 스스로 자리를 잡는 네트워크 시각화입니다.<br><br>
        <strong>좌클릭 드래그:</strong> 특정 노드 당기기<br>
        <strong>우클릭 드래그:</strong> 시점 회전
    </div>
</div>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
      }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. Scene Setup
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d1117, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 60);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.mouseButtons = {
        LEFT: null,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.ROTATE
    };

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(20, 20, 20);
    scene.add(dirLight);

    // 2. Data Structure Generation
    const NODE_COUNT = 80;
    const nodes = [];
    const edges = [];

    const nodeGeometry = new THREE.SphereGeometry(1, 16, 16);
    const nodeMaterial = new THREE.MeshPhongMaterial({ color: 0x79c0ff });
    const highlightMaterial = new THREE.MeshPhongMaterial({ color: 0xff7b72 });

    const nodeGroup = new THREE.Group();
    scene.add(nodeGroup);

    for (let i = 0; i < NODE_COUNT; i++) {
        const mesh = new THREE.Mesh(nodeGeometry, nodeMaterial);
        mesh.position.set(
            (Math.random() - 0.5) * 40,
            (Math.random() - 0.5) * 40,
            (Math.random() - 0.5) * 40
        );
        nodeGroup.add(mesh);

        nodes.push({
            id: i,
            mesh: mesh,
            velocity: new THREE.Vector3(),
            force: new THREE.Vector3(),
            isDragged: false
        });
    }

    // Generate random tree-like edges to simulate concept derivation
    for (let i = 1; i < NODE_COUNT; i++) {
        const targetId = Math.floor(Math.random() * i);
        edges.push({ source: i, target: targetId });

        // Add cross-links for complexity
        if (Math.random() < 0.15) {
            const randomId = Math.floor(Math.random() * NODE_COUNT);
            if (randomId !== i) edges.push({ source: i, target: randomId });
        }
    }

    const lineMaterial = new THREE.LineBasicMaterial({ color: 0x30363d, transparent: true, opacity: 0.6 });
    const lineGeometry = new THREE.BufferGeometry();
    const linePositions = new Float32Array(edges.length * 6);
    lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
    const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
    scene.add(lines);

    // 3. Physics Engine Variables
    const CONSTANTS = {
        REPULSION: 150.0,
        SPRING_K: 0.03,
        SPRING_LENGTH: 5.0,
        GRAVITY: 0.005,
        DAMPING: 0.85
    };

    // 4. Interaction (Raycaster Drag)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const intersectionPoint = new THREE.Vector3();
    let draggedNode = null;

    renderer.domElement.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(nodeGroup.children);

        if (intersects.length > 0) {
            const selectedMesh = intersects[0].object;
            draggedNode = nodes.find(n => n.mesh === selectedMesh);
            draggedNode.isDragged = true;
            draggedNode.mesh.material = highlightMaterial;
            dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(dragPlane.normal), draggedNode.mesh.position);
        }
    });

    renderer.domElement.addEventListener('mousemove', (e) => {
        if (!draggedNode) return;
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        if (raycaster.ray.intersectPlane(dragPlane, intersectionPoint)) {
            draggedNode.mesh.position.copy(intersectionPoint);
        }
    });

    window.addEventListener('mouseup', () => {
        if (draggedNode) {
            draggedNode.isDragged = false;
            draggedNode.mesh.material = nodeMaterial;
            draggedNode = null;
        }
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 5. Physics and Rendering Loop
    function applyPhysics() {
        // Reset forces
        for (let i = 0; i < NODE_COUNT; i++) {
            nodes[i].force.set(0, 0, 0);
        }

        // Apply Coulomb's Repulsion
        for (let i = 0; i < NODE_COUNT; i++) {
            for (let j = i + 1; j < NODE_COUNT; j++) {
                const n1 = nodes[i];
                const n2 = nodes[j];
                const diff = new THREE.Vector3().subVectors(n1.mesh.position, n2.mesh.position);
                const distSq = diff.lengthSq();

                if (distSq > 0.1) {
                    const forceMag = CONSTANTS.REPULSION / distSq;
                    diff.normalize().multiplyScalar(forceMag);
                    n1.force.add(diff);
                    n2.force.sub(diff);
                }
            }
        }

        // Apply Hooke's Attraction along edges
        for (let i = 0; i < edges.length; i++) {
            const sourceNode = nodes[edges[i].source];
            const targetNode = nodes[edges[i].target];
            const diff = new THREE.Vector3().subVectors(targetNode.mesh.position, sourceNode.mesh.position);
            const dist = diff.length();

            const forceMag = (dist - CONSTANTS.SPRING_LENGTH) * CONSTANTS.SPRING_K;
            diff.normalize().multiplyScalar(forceMag);

            sourceNode.force.add(diff);
            targetNode.force.sub(diff);
        }

        // Central Gravity & Position Update
        const positions = lineGeometry.attributes.position.array;
        let lineIndex = 0;

        for (let i = 0; i < NODE_COUNT; i++) {
            const node = nodes[i];

            if (!node.isDragged) {
                const gravityForce = new THREE.Vector3().copy(node.mesh.position).multiplyScalar(-CONSTANTS.GRAVITY);
                node.force.add(gravityForce);

                node.velocity.add(node.force);
                node.velocity.multiplyScalar(CONSTANTS.DAMPING);
                node.mesh.position.add(node.velocity);
            } else {
                node.velocity.set(0, 0, 0);
            }
        }

        // Sync line positions
        for (let i = 0; i < edges.length; i++) {
            const p1 = nodes[edges[i].source].mesh.position;
            const p2 = nodes[edges[i].target].mesh.position;

            positions[lineIndex++] = p1.x;
            positions[lineIndex++] = p1.y;
            positions[lineIndex++] = p1.z;
            positions[lineIndex++] = p2.x;
            positions[lineIndex++] = p2.y;
            positions[lineIndex++] = p2.z;
        }
        lineGeometry.attributes.position.needsUpdate = true;
    }

    function animate() {
        requestAnimationFrame(animate);
        applyPhysics();
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
