<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html,body{
            margin:0;
            width:100%;
            height:100%;
            overflow:hidden;
            background:#f7f5f0;
            font-family:sans-serif;
        }

        canvas{
            display:block;
        }

        .info{
            position:fixed;
            top:24px;
            left:24px;
            color:#222;
        }

        .info h1{
            margin:0;
            font-size:36px;
            font-weight:200;
        }

        .info p{
            opacity:.55;
        }

        @media (max-width:560px){
            .info{
                display:none;
            }
        }
    </style>
</head>
<body>

<div class="info">
    <h1>Growing Origami</h1>
    <p>Move the mouse to influence growth · Click to plant a seed</p>
</div>

<canvas id="c"></canvas>

<script>

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    let w,h;

    function resize(){
        w = canvas.width = innerWidth;
        h = canvas.height = innerHeight;
    }
    resize();
    addEventListener("resize",resize);

    const mouse={
        x:w/2,
        y:h/2
    };

    addEventListener("mousemove",e=>{
        mouse.x=e.clientX;
        mouse.y=e.clientY;
    });

    const nodes=[];

    class Node{

        constructor(x,y,angle,size,depth=0){

            this.x=x;
            this.y=y;

            this.angle=angle;
            this.size=size;

            this.depth=depth;

            this.grown=false;
        }

        draw(){

            const x2=
                this.x+
                Math.cos(this.angle)*this.size;

            const y2=
                this.y+
                Math.sin(this.angle)*this.size;

            const x3=
                this.x+
                Math.cos(this.angle+Math.PI/3)*this.size;

            const y3=
                this.y+
                Math.sin(this.angle+Math.PI/3)*this.size;

            ctx.beginPath();

            ctx.moveTo(this.x,this.y);
            ctx.lineTo(x2,y2);
            ctx.lineTo(x3,y3);

            ctx.closePath();

            const light=
                90-this.depth*4;

            ctx.fillStyle=
                `hsl(
        210,
        20%,
        ${light}% )`;

            ctx.fill();

            ctx.strokeStyle=
                "rgba(0,0,0,.08)";

            ctx.stroke();
        }

        grow(){

            if(this.grown) return;

            if(this.depth>9) return;

            this.grown=true;

            const dir=
                Math.atan2(
                    mouse.y-this.y,
                    mouse.x-this.x
                );

            const bias=
                (dir-this.angle)*0.2;

            const count=
                Math.random()<0.7 ? 2 : 3;

            for(let i=0;i<count;i++){

                const offset=
                    (-0.8+i*0.8);

                nodes.push(

                    new Node(
                        this.x+
                        Math.cos(this.angle)*this.size,

                        this.y+
                        Math.sin(this.angle)*this.size,

                        this.angle+
                        offset+
                        bias+
                        (Math.random()-0.5)*0.3,

                        this.size*0.92,

                        this.depth+1
                    )

                );
            }
        }
    }

    function seed(x,y){

        nodes.push(
            new Node(
                x,
                y,
                Math.random()*Math.PI*2,
                45,
                0
            )
        );
    }

    seed(w/2,h/2);

    addEventListener("click",e=>{
        seed(e.clientX,e.clientY);
    });

    function animate(){

        ctx.clearRect(0,0,w,h);

        for(const n of nodes){
            n.draw();
        }

        if(
            nodes.length<3000 &&
            Math.random()<0.18
        ){

            const candidates=
                nodes.filter(
                    n=>!n.grown
                );

            if(candidates.length){

                const pick=
                    candidates[
                        Math.floor(
                            Math.random()*
                            candidates.length
                        )];

                pick.grow();
            }
        }

        requestAnimationFrame(
            animate
        );
    }

    animate();

</script>
</body>
</html>
