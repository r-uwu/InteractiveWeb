<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D Raymarching Metaballs</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; user-select: none; }
        #ui-layer {
            position: absolute; top: 15px; left: 15px; width: 300px;
            background: rgba(15, 15, 20, 0.8); color: #fff;
            padding: 20px; border-radius: 12px; font-family: sans-serif;
            box-shadow: 0 4px 25px rgba(0,0,0,0.8); z-index: 100;
            border: 1px solid #333; backdrop-filter: blur(8px);
            transition: opacity 0.3s;
        }
        h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #444; padding-bottom: 10px; color: #00ffff; }
        .instruction { font-size: 13px; line-height: 1.5; margin-bottom: 15px; color: #ccc; }
        .control-group { margin-bottom: 15px; }
        label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; color: #ddd; font-weight: bold; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #00ffff; }
        input[type=color] { width: 100%; height: 35px; cursor: pointer; border: none; outline: none; background: transparent; }

        /* 반응형: 화면 너비 560px 미만일 때 UI 패널 숨김 */
        @media (max-width: 560px) {
            #ui-layer { display: none; }
        }
    </style>
</head>
<body>
<div id="ui-layer">
    <h2>액체 금속 메타볼 (Raymarching)</h2>
    <div class="instruction">
        폴리곤 없이 순수 수학 공식(SDF)으로만 렌더링된 유기체입니다.<br><br>
        <strong>마우스 이동:</strong> 중앙의 물방울 조종
    </div>

    <div class="control-group">
        <label><span>융합 점성 (Smoothness)</span> <span id="val-smooth">0.8</span></label>
        <input type="range" id="inp-smooth" min="0.1" max="2.0" step="0.05" value="0.8">
    </div>
    <div class="control-group">
        <label><span>움직임 속도 (Speed)</span> <span id="val-speed">1.0</span></label>
        <input type="range" id="inp-speed" min="0.1" max="3.0" step="0.1" value="1.0">
    </div>
    <div class="control-group">
        <label><span>표면 색상 (Color)</span></label>
        <input type="color" id="inp-color" value="#00aaff">
    </div>
</div>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.1/build/three.module.js"
      }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // 1. Scene 설정 (단일 평면 렌더링 용)
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 2. Vertex Shader (화면 전체를 덮는 쿼드)
    const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

    // 3. Fragment Shader (레이마칭 및 SDF 메인 로직)
    const fragmentShader = `
            uniform float uTime;
            uniform vec2 uResolution;
            uniform vec2 uMouse;
            uniform float uSmoothness;
            uniform vec3 uColor;

            // 부드러운 병합을 위한 다항식 Smooth Minimum (smin)
            float smin(float a, float b, float k) {
                float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
                return mix(b, a, h) - k * h * (1.0 - h);
            }

            // 구체에 대한 부호 거리 함수 (Signed Distance Function)
            float sdSphere(vec3 p, float s) {
                return length(p) - s;
            }

            // 3D 공간을 그리는 맵핑 함수 (모든 도형의 수학적 정의)
            float map(vec3 p) {
                // 첫 번째 물방울 (마우스 커서를 따라다님)
                vec3 mousePos = vec3((uMouse.x - 0.5) * 8.0, (uMouse.y - 0.5) * 8.0, 0.0);
                float d = sdSphere(p - mousePos, 0.9);

                // 나머지 물방울들 (삼각함수로 궤도 운동)
                vec3 pos2 = vec3(sin(uTime * 1.2) * 2.0, cos(uTime * 0.8) * 1.5, sin(uTime * 1.5) * 1.0);
                d = smin(d, sdSphere(p - pos2, 1.2), uSmoothness);

                vec3 pos3 = vec3(cos(uTime * 1.5) * 2.5, sin(uTime * 1.1) * 2.0, cos(uTime * 0.9) * 1.5);
                d = smin(d, sdSphere(p - pos3, 0.8), uSmoothness);

                vec3 pos4 = vec3(sin(uTime * 0.7) * -2.0, cos(uTime * 1.4) * 2.2, sin(uTime * 0.4) * -1.2);
                d = smin(d, sdSphere(p - pos4, 1.0), uSmoothness);

                vec3 pos5 = vec3(cos(uTime * 1.1) * 1.5, sin(uTime * 0.5) * -2.5, cos(uTime * 1.3) * -1.0);
                d = smin(d, sdSphere(p - pos5, 0.7), uSmoothness);

                return d;
            }

            // SDF 표면의 법선 벡터(Normal)를 미분하여 도출 (조명 계산용)
            vec3 calcNormal(vec3 p) {
                const vec2 e = vec2(0.001, 0.0);
                return normalize(vec3(
                    map(p + e.xyy) - map(p - e.xyy),
                    map(p + e.yxy) - map(p - e.yxy),
                    map(p + e.yyx) - map(p - e.yyx)
                ));
            }

            void main() {
                // 픽셀 좌표를 -1.0 ~ 1.0 범위로 정규화 및 화면 비율 보정
                vec2 uv = gl_FragCoord.xy / uResolution.xy;
                vec2 p = uv * 2.0 - 1.0;
                p.x *= uResolution.x / uResolution.y;

                // 레이(빛)의 원점(카메라)과 방향 벡터 설정
                vec3 ro = vec3(0.0, 0.0, 6.0);
                vec3 rd = normalize(vec3(p, -2.0));

                float t = 0.0;
                float maxD = 20.0;
                vec3 color = vec3(0.03, 0.03, 0.05); // 배경색

                // 레이마칭 루프 (빛을 쏘며 거리를 재는 과정)
                for(int i = 0; i < 80; i++) {
                    vec3 pos = ro + rd * t;
                    float d = map(pos);

                    // 빛이 물체 표면에 닿았을 때 (d가 0에 근접)
                    if(d < 0.001) {
                        vec3 normal = calcNormal(pos);

                        // 기본 조명 (Diffuse)
                        vec3 lightDir = normalize(vec3(1.0, 2.0, 1.0));
                        float diff = max(dot(normal, lightDir), 0.0);

                        // 반사광 (Specular) - 금속성 강조
                        vec3 viewDir = normalize(ro - pos);
                        vec3 reflectDir = reflect(-lightDir, normal);
                        float spec = pow(max(dot(viewDir, reflectDir), 0.0), 64.0);

                        // 테두리 빛 (Fresnel) - 물방울 윤곽선 발광 효과
                        float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.0);

                        // 최종 색상 혼합
                        color = uColor * (diff * 0.7 + 0.3) + vec3(1.0) * spec * 1.2 + vec3(1.0) * fresnel * 0.8;
                        break;
                    }

                    if(t > maxD) break; // 멀리 벗어나면 루프 종료
                    t += d; // SDF 거리만큼 안전하게 전진
                }

                // 감마 보정 (Gamma Correction)
                color = pow(color, vec3(1.0 / 2.2));
                gl_FragColor = vec4(color, 1.0);
            }
        `;

    // 4. Uniforms 및 메쉬 생성
    const uniforms = {
        uTime: { value: 0 },
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        uMouse: { value: new THREE.Vector2(0.5, 0.5) },
        uSmoothness: { value: 0.8 },
        uColor: { value: new THREE.Color(0x00aaff) }
    };

    const geometry = new THREE.PlaneGeometry(2, 2); // 화면을 덮는 쿼드
    const material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        uniforms
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // 5. 마우스 및 UI 상호작용
    document.addEventListener('mousemove', (e) => {
        // Y축 방향은 브라우저(아래가 +)와 WebGL(위가 +)이 다르므로 반전 처리
        uniforms.uMouse.value.x = e.clientX / window.innerWidth;
        uniforms.uMouse.value.y = 1.0 - (e.clientY / window.innerHeight);
    });

    // 모바일 터치 지원
    document.addEventListener('touchmove', (e) => {
        uniforms.uMouse.value.x = e.touches[0].clientX / window.innerWidth;
        uniforms.uMouse.value.y = 1.0 - (e.touches[0].clientY / window.innerHeight);
    }, { passive: true });

    const inpSmooth = document.getElementById('inp-smooth');
    const inpSpeed = document.getElementById('inp-speed');
    const inpColor = document.getElementById('inp-color');

    inpSmooth.addEventListener('input', () => {
        document.getElementById('val-smooth').textContent = inpSmooth.value;
        uniforms.uSmoothness.value = parseFloat(inpSmooth.value);
    });

    inpColor.addEventListener('input', () => {
        uniforms.uColor.value.setHex(parseInt(inpColor.value.replace('#', '0x')));
    });

    window.addEventListener('resize', () => {
        uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 6. 애니메이션 루프
    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        const speed = parseFloat(inpSpeed.value);
        uniforms.uTime.value += clock.getDelta() * speed;
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
